name: bootimg

# Builds the OnePlus 5 boot image around the kernel of a successful xnu run:
# mainline DTB, ADT (--highmem), SWEETXNU payload, shim boot.img v0.
# Download the "cheeseburger-boot" artifact and `fastboot boot` it (RAM only).
on:
  workflow_run:
    workflows: [xnu]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: xnu workflow run whose xnu-kernel artifact to use
        required: true
      cmdline:
        description: XNU boot-args
        default: ""

permissions:
  actions: read
  contents: write

env:
  # Stage 1 (PORT-OP5.md): one gold core, root on userdata read-only, no log writes.
  DEFAULT_CMDLINE: debug=0xc serial=3 cpus=1 keepsyms=1 -noprogress rd=ufsroot0 wdt=-1 wdt_test=no_user_checkin sweetlog=0

jobs:
  bootimg:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        timeout-minutes: 12
        run: |
          # Fresh runners can hold the dpkg lock (unattended upgrades): stop it and
          # bound the wait; skip the man-db rebuild that can stall 24.04 runners.
          sudo systemctl stop unattended-upgrades apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          APT="sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=3"
          $APT update
          $APT install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            binutils-aarch64-linux-gnu device-tree-compiler mkbootimg cpio
          # Ubuntu's mkbootimg imports a GKI module it does not ship (unused for v0)
          mkdir -p "$RUNNER_TEMP/pystub/gki"
          touch "$RUNNER_TEMP/pystub/gki/__init__.py"
          echo 'def generate_gki_certificate(*a, **k): raise SystemExit("no GKI")' > "$RUNNER_TEMP/pystub/gki/generate_gki_certificate.py"
          echo "PYTHONPATH=$RUNNER_TEMP/pystub" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: xnu/out
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check kernel
        run: |
          ls -la xnu/out
          file xnu/out/kernel.development.sweet || true
          # ARMv8.0 gold cores: count v8.1+ atomics / ldapr if llvm-objdump exists
          if command -v llvm-objdump >/dev/null; then
            n=$(llvm-objdump -d --mattr=+v8.5a xnu/out/kernel.development.sweet | grep -cP '\t(cas|casa|casal|casl|ldadd|ldset|ldclr|ldeor|swp|ldapr)\w*\s' || true)
            echo "v8.1+ atomics / ldapr in the kernel: $n (topaz: only the K256 SHA table)"
          fi

      - name: Boot image
        run: |
          cmdline="${{ inputs.cmdline }}"
          [ -n "$cmdline" ] || cmdline="$DEFAULT_CMDLINE"
          tools/mkdtb-mainline.sh
          mkdir -p shim/out
          python3 tools/mkadt.py shim/out/cb.adt --highmem
          python3 tools/mkpayload.py xnu/out/kernel.development.sweet shim/out/cb.adt shim/out/payload.bin --cmdline "$cmdline"
          DTB=../dtb/mainline/msm8998-oneplus-cheeseburger.dtb bash shim/build.sh ../shim/out/payload.bin
          cp shim/out/shim-boot.img shim/out/shim-boot-xnu.img
          echo "$cmdline" > shim/out/cmdline.txt
          sha256sum shim/out/shim-boot-xnu.img | tee shim/out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cheeseburger-boot
          path: |
            shim/out/shim-boot-xnu.img
            shim/out/cmdline.txt
            shim/out/SHA256SUMS

      # Also keep the image on the "builds" branch: git fetches reach it where
      # artifact downloads (Azure blob storage) are blocked.
      - name: Publish to builds branch
        run: |
          mkdir -p "$RUNNER_TEMP/b" && cd "$RUNNER_TEMP/b"
          git init -q && git checkout -q -b builds
          cp "$GITHUB_WORKSPACE"/shim/out/shim-boot-xnu.img "$GITHUB_WORKSPACE"/shim/out/cmdline.txt "$GITHUB_WORKSPACE"/shim/out/SHA256SUMS .
          printf 'xnu run %s, bootimg run %s, commit %s\n' "${{ inputs.run_id || github.event.workflow_run.id }}" "${{ github.run_id }}" "${{ github.sha }}" > SOURCE.txt
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "boot image from bootimg run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
